# Publishes embers-memory to PyPI via Trusted Publishing (OIDC). No API token exists anywhere:
# PyPI trusts this exact workflow file in this exact repository, running in the "pypi" environment.
# Trigger: publishing a GitHub Release whose tag is v<version> matching pyproject.toml.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches pyproject.toml
        run: |
          v=$(python - <<'PY'
          import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])
          PY
          )
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - name: Test (synthetic fixtures only)
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the OIDC token PyPI exchanges for a short-lived upload credential
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
