[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-archive"
version = "0.1.0"
description = "Local-first SQLite/FTS5 archive over Claude Code session transcripts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mem = "memarchive.cli:main"

[tool.setuptools]
packages = ["memarchive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
