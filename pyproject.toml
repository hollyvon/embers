[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "embers-memory"
version = "0.2.0"
description = "Embers: lossless memory for Claude Code. Local SQLite/FTS5 archive over session transcripts."
license = {text = "MIT"}
authors = [{name = "Holly Wren von Heidereich"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
anthropic = ["anthropic"]

[project.scripts]
embers = "embers.cli:main"
mem = "embers.cli:main"

[tool.setuptools]
packages = ["embers", "embers.skill"]

[tool.setuptools.package-dir]
"embers.skill" = "skills/embers"

[tool.setuptools.package-data]
"embers.skill" = ["SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
